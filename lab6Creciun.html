<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3 p-md-4" style="background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif;">

    <h1 class="text-center mb-4" style="color: #0047a3;">Produse populare</h1>

    <div class="container d-flex flex-wrap justify-content-center align-items-center gap-4 p-4 rounded-4 border" style="min-height: 480px; background-color: #e2e8f0; border-color: #cbd5e1 !important;">
        <div class="card bg-white border-2 p-3 d-flex flex-column align-items-center" style="width: 200px; border-color: #78070d !important; border-radius: 20px;">
            <img src="monitor.jpg" alt="Monitor" class="card-img-top w-100 rounded-3 border mb-3 object-fit-cover" style="height: 150px; border-color: #e2e8f0 !important;">
            <h2 class="card-title fs-5 text-dark mb-1 align-self-start ps-1">Monitor</h2>
            <p class="card-text mb-3 align-self-start ps-1" style="font-size: 15px; color: #2563eb;">25 199 lei</p>
            <button class="btn fw-bold text-dark border border-dark rounded-pill py-1" style="width: 85%; background-color: #74cc64; font-size: 14px;">Cumpără</button>
        </div>
        <div class="card bg-white border-2 p-3 d-flex flex-column align-items-center" style="width: 200px; border-color: #78070d !important; border-radius: 20px;">
            <img src="laptop.jpg" alt="Laptop" class="card-img-top w-100 rounded-3 border mb-3 object-fit-cover" style="height: 150px; border-color: #e2e8f0 !important;">
            <h2 class="card-title fs-5 text-dark mb-1 align-self-start ps-1">Laptop</h2>
            <p class="card-text mb-3 align-self-start ps-1" style="font-size: 15px; color: #2563eb;">70 990 lei</p>
            <button class="btn fw-bold text-dark border border-dark rounded-pill py-1" style="width: 85%; background-color: #74cc64; font-size: 14px;">Cumpără</button>
        </div>
        <div class="card bg-white border-2 p-3 d-flex flex-column align-items-center" style="width: 200px; border-color: #78070d !important; border-radius: 20px;">
            <img src="tastatura.jpg" alt="Tastatură" class="card-img-top w-100 rounded-3 border mb-3 object-fit-cover" style="height: 150px; border-color: #e2e8f0 !important;">
            <h2 class="card-title fs-5 text-dark mb-1 align-self-start ps-1">Tastatură</h2>
            <p class="card-text mb-3 align-self-start ps-1" style="font-size: 15px; color: #2563eb;">5999 lei</p>
            <button class="btn fw-bold text-dark border border-dark rounded-pill py-1" style="width: 85%; background-color: #74cc64; font-size: 14px;">Cumpără</button>
        </div>
    </div>

</body>
</html>
